version: "3.9"

services:
  mysql:
    image: mysql:5.7
    platform: linux/x86_64
    container_name: testsigma_mysql
    restart: always
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testsigma_opensource
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    healthcheck:
      test: out=$$(mysqladmin ping -h localhost -P 3306 -u root --password=root 2>&1); echo $$out | grep 'mysqld is alive' || { echo $$out; exit 1; }
      interval: 1s
      retries: 120

  testsigma_server:
    image: testsigmahq/server:v3.0.1
    container_name: testsigma_server
    restart: always
    volumes:
      - ./ts_data:/opt/app/ts_data
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9090"

  ts_proxy:
    image: nginx:1.20-alpine
    container_name: testsigma_proxy
    restart: always
    depends_on:
      - testsigma_server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
